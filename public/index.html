<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1120">
<link rel="icon" href="data:,">
<title>Lowkey 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #0d1120; color: #eef2ff;
    font-family: Tahoma, Arial, sans-serif; touch-action: none; overscroll-behavior: none; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; text-align: center; z-index: 20;
    background: radial-gradient(1200px 800px at 70% 20%, #1a2340 0%, #0d1120 60%); }
  h1 { font-size: 44px; color: #ffd34d; text-shadow: 0 0 24px rgba(255,211,77,.35); letter-spacing: 1px; }
  h2 { font-size: 22px; color: #ffd34d; }
  .sub { color: #9fb0d0; font-size: 15px; line-height: 1.7; max-width: 320px; }
  input { width: 240px; padding: 12px; font-size: 18px; text-align: center; border-radius: 10px;
    border: 2px solid #2c3a5e; background: #171e30; color: #fff; outline: none; }
  input:focus { border-color: #ffd34d; }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 12px;
    background: #ffd34d; color: #1a1a1a; font-size: 18px; font-weight: bold; padding: 13px 34px; }
  button:disabled { background: #3a4767; color: #7c8bb0; }
  button.ghost { background: #232c44; color: #cfe0ff; font-size: 15px; padding: 10px 20px; }
  #roomCode { font-size: 40px; letter-spacing: 10px; color: #7ef0c1; font-weight: bold; direction: ltr;
    text-shadow: 0 0 16px rgba(126,240,193,.4); }
  #plist { display: flex; flex-direction: column; gap: 6px; min-width: 240px; }
  .prow { background: #1b2438; border-radius: 8px; padding: 8px 14px; font-size: 16px; display: flex; justify-content: space-between; }
  .hidden { display: none !important; }
  #gl { position: fixed; inset: 0; }
  #gl canvas { display: block; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    padding: 10px 14px; pointer-events: none; font-size: 16px; z-index: 5; }
  .pill { background: rgba(13,17,32,.8); border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 6px 14px; }
  #timer.warn { color: #ff6b6b; }
  #effects { position: fixed; top: 50px; left: 14px; display: flex; gap: 6px; pointer-events: none; z-index: 5; }
  .fx { background: rgba(13,17,32,.8); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 4px 10px; font-size: 14px; }
  #secret { position: fixed; top: 84px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 5; }
  #secret span { background: linear-gradient(90deg,#ffd34d,#ff9d3d); color: #1a1a1a; font-weight: bold;
    border-radius: 24px; padding: 9px 22px; font-size: 16px; box-shadow: 0 0 18px rgba(255,211,77,.5); }
  #toast { position: fixed; bottom: 190px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 5; }
  #toast span { background: rgba(20,26,42,.92); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 8px 18px; font-size: 15px; color: #cfe0ff; }
  .actbtn { position: fixed; z-index: 6; width: 76px; height: 76px; border-radius: 50%; font-size: 14px;
    padding: 0; box-shadow: 0 4px 14px rgba(0,0,0,.45); line-height: 1.2; }
  .actbtn small { font-size: 12px; }
  #btnSearch { left: 18px; bottom: 128px; background: #7ef0c1; }
  #btnExpose { left: 104px; bottom: 46px; background: #ff6b6b; color: #fff; }
  #btnBuild { left: 18px; bottom: 216px; background: #c98d4b; color: #fff; }
  #btnGhost { left: 104px; bottom: 134px; background: #b48cff; color: #fff; }
  #stick { position: fixed; z-index: 4; right: 26px; bottom: 60px; width: 130px; height: 130px;
    border-radius: 50%; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.15); }
  #knob { position: absolute; width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,255,255,.25); left: 38px; top: 38px; }
  #endOverlay { position: fixed; inset: 0; background: rgba(8,11,20,.9); z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  #endTitle { font-size: 28px; color: #ffd34d; }
  #endDetail { font-size: 17px; color: #cfe0ff; line-height: 1.8; }
  #lobbyEvents { font-size: 14px; color: #9fb0d0; min-height: 20px; }
  #avRow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0 10px; }
  #avRow button { width: 44px; height: 44px; font-size: 22px; border-radius: 12px; border: 2px solid transparent; background: rgba(255,255,255,.06); cursor: pointer; padding: 0; }
  #avRow button.sel { border-color: #7ee0ff; background: rgba(126,224,255,.18); }
  #avRow button.taken { opacity: .3; }
  .classicLink { font-size: 13px; color: #5f7099; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>

<div id="join" class="screen">
  <h1>Lowkey 🫣</h1>
  <p class="sub">كنز واحد مخبي في المكان.. دوّر عليه، ولما تلاقيه <b>متخليش حد يعرف إنه معاك</b>! وصّله للخزنة من غير ما حد يمسكك واكسب. ابني حيطان، خد الباورات، ولو شكيت في حد.. اكشفه!</p>
  <input id="nameIn" maxlength="14" placeholder="اسمك" autocomplete="off">
  <input id="codeIn" maxlength="4" placeholder="كود الأوضة (لو معاك)" autocomplete="off" style="text-transform:uppercase">
  <button id="btnJoin">ادخل / اعمل أوضة</button>
  <div id="joinErr" style="color:#ff6b6b;font-size:14px"></div>
  <a class="classicLink" href="/classic">النسخة الكلاسيك 2D</a>
</div>

<div id="lobby" class="screen hidden">
  <h2>الأوضة</h2>
  <div id="roomCode"></div>
  <button class="ghost" id="btnShare">📤 ابعت اللينك لصحابك</button>
  <div id="plist"></div>
  <p class="sub" style="margin:10px 0 2px">اختار شخصيتك:</p>
  <div id="avRow"></div>
  <div id="lobbyEvents"></div>
  <div style="display:flex;gap:10px">
    <button class="ghost" id="btnAddBot">🤖 زوّد بوت</button>
    <button class="ghost" id="btnRmBot">شيل بوت</button>
  </div>
  <button id="btnStart">ابدأ اللعبة 🎮</button>
  <p class="sub" id="lobbyHint"></p>
</div>

<div id="gl" class="hidden"></div>

<div id="hud" class="hidden">
  <div class="pill" id="timer">3:00</div>
  <div class="pill" id="scoreline"></div>
</div>
<div id="effects" class="hidden"></div>
<div id="secret" class="hidden"><span>🤫 الكنز معاك! وصّله للخزنة من غير ما حد يشك</span></div>
<div id="toast" class="hidden"><span id="toastTxt"></span></div>

<div id="stick" class="hidden"><div id="knob"></div></div>
<button id="btnSearch" class="actbtn hidden">🔍<br>دوّر</button>
<button id="btnExpose" class="actbtn hidden">🫵<br>اكشف</button>
<button id="btnBuild" class="actbtn hidden">🧱<br><small id="wallCount">٣</small></button>
<button id="btnGhost" class="actbtn hidden">👻<br>تخفّي</button>

<div id="endOverlay" class="hidden">
  <div id="endTitle"></div>
  <div id="endDetail"></div>
  <button id="btnAgain">ارجعوا للأوضة 🔁</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);

let ws, myId = null, roomCode = null, map = null, roster = {};
const AVATARS = ['🦊', '🐼', '🐸', '🦁', '🐰', '🐯', '🐵', '🦉', '🐙', '🐺', '🦄', '🐝'];
const AV_COLORS = [0xff9d5c, 0xf2f2f2, 0x7ee081, 0xffc46b, 0xffb3d9, 0xffa94d, 0xc9a06b, 0xb9a8ff, 0x7ed3e8, 0x9aa7bd, 0xe8b3ff, 0xffe066];
let state = { players: [], spots: [], walls: [], powers: [], left: 0, me: {} };
let carrier = false;
let phase = 'join';
let revealId = null, revealUntil = 0;
let ghostUntil = 0;

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function connect(name, code, cb) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host);
  ws.onopen = () => ws.send(JSON.stringify({ t: 'hello', name, room: code || '' }));
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    handle(m, cb);
  };
  ws.onclose = () => {
    if (phase !== 'join') {
      toast('انقطع الاتصال.. حدّث الصفحة');
      setTimeout(() => location.reload(), 2500);
    }
  };
}

function handle(m, joinCb) {
  switch (m.t) {
    case 'joined':
      myId = m.id; roomCode = m.room; map = m.map;
      joinCb && joinCb(true);
      showLobby();
      break;
    case 'error':
      if (m.msg === 'room_not_found') { $('joinErr').textContent = 'الكود ده مش موجود.. اتأكد منه'; joinCb && joinCb(false); }
      if (m.msg === 'room_full') { $('joinErr').textContent = 'الأوضة مليانة (١٠ لاعيبة)'; joinCb && joinCb(false); }
      break;
    case 'lobby':
      phase = 'lobby';
      renderLobby(m);
      break;
    case 'begin':
      phase = 'game';
      roster = {};
      m.players.forEach(p => roster[p.id] = p);
      map = m.map;
      carrier = false;
      revealId = null;
      ghostUntil = 0;
      $('secret').classList.add('hidden');
      $('endOverlay').classList.add('hidden');
      buildWorld();
      showGame();
      break;
    case 'state':
      state = m;
      updateHud();
      break;
    case 'spot':
      if (!state.spots.includes(m.id)) state.spots.push(m.id);
      break;
    case 'empty':
      toast('فاضي! مفيش هنا حاجة 🕳️');
      break;
    case 'secret':
      if (m.carrier) {
        carrier = true;
        $('secret').classList.remove('hidden');
        buzz([80, 60, 80]);
      }
      break;
    case 'power':
      if (m.type === 'speed') toast('⚡ سرعة خارقة ٦ ثواني!');
      if (m.type === 'shield') toast('🛡️ درع! بيحميك من كشف واحد');
      if (m.type === 'reveal') toast('👁️ شفت الحرامي! وراك وراه');
      if (m.type === 'ghost') toast('👻 اختفيت عن الأنظار لحظات!');
      if (m.type === 'goggles') toast('🥽 نظارة الرؤية: شايف المختفيين ٦ ثواني!');
      buzz(60);
      break;
    case 'reveal':
      revealId = m.id;
      revealUntil = Date.now() + m.ms;
      break;
    case 'ghost':
      ghostUntil = Date.now() + m.ms;
      toast('👻 اختفيت! محدش شايفك');
      buzz([40, 40, 40]);
      break;
    case 'event':
      if (m.kind === 'wrong_expose') toast('❌ ' + m.by + ' اتهم ' + m.on + ' غلط واتجمد ١٢ ثانية!');
      if (m.kind === 'exposed') toast('🚨 ' + m.by + ' كشف ' + m.on + ' والكنز كان معاه!');
      if (m.kind === 'shielded') toast('🛡️ درع ' + m.on + ' صدّ كشف ' + m.by + '!');
      if (m.kind === 'treasure_moved') toast('👀 حسيت بحركة.. الكنز غيّر مكانه!');
      break;
    case 'end':
      showEnd(m);
      break;
  }
}

// ---------- screens ----------
function show(id) {
  ['join', 'lobby'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  const inGame = id === null;
  $('gl').classList.toggle('hidden', !inGame);
  $('hud').classList.toggle('hidden', !inGame);
  $('effects').classList.toggle('hidden', !inGame);
  $('stick').classList.toggle('hidden', !inGame);
  if (!inGame) ['btnSearch', 'btnExpose', 'btnBuild', 'btnGhost'].forEach(b => $(b).classList.add('hidden'));
}
function showLobby() { show('lobby'); $('endOverlay').classList.add('hidden'); }
function showGame() { show(null); onResize(); }

function renderLobby(m) {
  $('roomCode').textContent = m.room;
  roster = {};
  m.players.forEach(p => roster[p.id] = p);
  $('plist').innerHTML = m.players.map(p =>
    '<div class="prow"><span>' + (p.host ? '👑 ' : '') + (AVATARS[p.avatar] || '') + ' ' + esc(p.name) + '</span><span>🏆 ' + p.wins + '</span></div>'
  ).join('');
  const mineAv = roster[myId] ? roster[myId].avatar : -1;
  const takenAv = new Set(m.players.filter(p => p.id !== myId).map(p => p.avatar));
  $('avRow').innerHTML = AVATARS.map((a, i) =>
    '<button data-a="' + i + '" class="' + (i === mineAv ? 'sel' : takenAv.has(i) ? 'taken' : '') + '">' + a + '</button>'
  ).join('');
  $('avRow').querySelectorAll('button').forEach(b => b.onclick = () => ws && ws.send(JSON.stringify({ t: 'avatar', a: +b.dataset.a })));
  const amHost = m.players.find(p => p.id === myId && p.host);
  $('btnStart').style.display = amHost ? '' : 'none';
  $('btnAddBot').style.display = amHost ? '' : 'none';
  $('btnRmBot').style.display = amHost ? '' : 'none';
  $('btnStart').disabled = !m.canStart;
  $('lobbyHint').textContent = m.canStart
    ? 'الهوست يبدأ لما تكونوا جاهزين'
    : 'محتاجين ' + m.minPlayers + ' لاعيبة على الأقل (البوتات بتحسب).. ابعت اللينك لصحابك!';
}

function showEnd(m) {
  phase = 'end';
  carrier = false;
  $('secret').classList.add('hidden');
  ['btnSearch', 'btnExpose', 'btnBuild', 'btnGhost'].forEach(b => $(b).classList.add('hidden'));
  const title = $('endTitle'), detail = $('endDetail');
  if (m.reason === 'deposit') {
    title.textContent = '🏆 ' + m.winnerName + ' كسب!';
    detail.textContent = 'وصّل الكنز للخزنة من غير ما حد يمسكه.. حرامي محترف 🫣';
  } else if (m.reason === 'exposed') {
    title.textContent = '🏆 ' + m.winnerName + ' كسب!';
    detail.textContent = 'كشف ' + (m.carrierName || 'الحرامي') + ' وهو شايل الكنز! عين صقر 🦅';
  } else if (m.reason === 'timeout') {
    title.textContent = '⏰ الوقت خلص!';
    detail.textContent = m.carrierName
      ? 'الكنز كان مع ' + m.carrierName + ' ومحدش مسكه.. بس ماوصلش الخزنة'
      : 'محدش لاقى الكنز أصلاً 😅';
  } else {
    title.textContent = 'انتهت الجولة';
    detail.textContent = 'اللي كان معاه الكنز ساب اللعبة';
  }
  $('endOverlay').classList.remove('hidden');
}

// ---------- 3D world ----------
let renderer = null, scene = null, camera = null;
let worldBuilt = false;
let wallMeshes = [], dynWallMeshes = [], spotMeshes = [], powerMeshes = new Map(), playerMeshes = new Map();
let vaultMesh = null, vaultGlow = null;
let glFailed = false;

const POW_COLORS = { speed: 0xffd34d, shield: 0x6bb8ff, reveal: 0xff8ad4, ghost: 0xb48cff, goggles: 0x7ee0ff };

function initGL() {
  if (renderer || glFailed) return !glFailed;
  if (!window.THREE) { glFailed = true; fallback2d(); return false; }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
  } catch (e) {
    glFailed = true; fallback2d(); return false;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  $('gl').appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1c2947);
  scene.fog = new THREE.Fog(0x1c2947, 1100, 3200);
  camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 10, 6000);
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const dir = new THREE.DirectionalLight(0xfff2d9, 0.85);
  dir.position.set(400, 800, 300);
  scene.add(dir);
  requestAnimationFrame(tick);
  return true;
}

function fallback2d() {
  toast('المتصفح مش قادر يشغّل 3D.. بنحوّلك للنسخة الكلاسيك');
  setTimeout(() => { location.href = '/classic' + location.search; }, 1800);
}

function floorTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 320;
  const g = c.getContext('2d');
  g.fillStyle = '#1b2745'; g.fillRect(0, 0, 512, 320);
  g.strokeStyle = 'rgba(140,170,255,.12)'; g.lineWidth = 2;
  for (let x = 0; x <= 512; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 320); g.stroke(); }
  for (let y = 0; y <= 320; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke(); }
  const t = new THREE.CanvasTexture(c);
  return t;
}

function nameSprite(text, color) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 30px Tahoma';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 6;
  g.fillStyle = color;
  g.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(120, 30, 1);
  return sp;
}

function makePlayerMesh(p) {
  const info = roster[p.id] || {};
  const color = AV_COLORS[(info.avatar !== undefined ? info.avatar : 0) % AV_COLORS.length];
  const grp = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(13, 15, 30, 10), bodyMat);
  body.position.y = 15;
  grp.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(10, 10, 8), new THREE.MeshLambertMaterial({ color: 0xffe0bd }));
  head.position.y = 40;
  grp.add(head);
  // nose to show facing
  const nose = new THREE.Mesh(new THREE.ConeGeometry(4, 8, 6), new THREE.MeshLambertMaterial({ color: 0xffe0bd }));
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, 40, 12);
  grp.add(nose);
  const label = nameSprite((AVATARS[info.avatar] || '') + ' ' + (info.name || '?'), p.id === myId ? '#7ef0c1' : '#ffb98a');
  label.position.y = 66;
  grp.add(label);
  // search ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(24, 3, 6, 20), new THREE.MeshBasicMaterial({ color: 0xffd34d }));
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 2;
  ring.visible = false;
  grp.add(ring);
  grp.userData.ring = ring;
  // reveal marker
  const rmark = new THREE.Mesh(new THREE.TorusGeometry(30, 4, 6, 20), new THREE.MeshBasicMaterial({ color: 0xff4d4d }));
  rmark.rotation.x = Math.PI / 2;
  rmark.position.y = 56;
  rmark.visible = false;
  grp.add(rmark);
  grp.userData.rmark = rmark;
  // ice block for frozen
  const ice = new THREE.Mesh(new THREE.BoxGeometry(42, 54, 42), new THREE.MeshLambertMaterial({ color: 0x9ecbff, transparent: true, opacity: 0.45 }));
  ice.position.y = 27;
  ice.visible = false;
  grp.add(ice);
  grp.userData.ice = ice;
  // progress bar (search/deposit)
  const barBg = new THREE.Mesh(new THREE.BoxGeometry(50, 6, 2), new THREE.MeshBasicMaterial({ color: 0x22304f }));
  barBg.position.y = 84;
  barBg.visible = false;
  grp.add(barBg);
  const barFg = new THREE.Mesh(new THREE.BoxGeometry(50, 6, 2), new THREE.MeshBasicMaterial({ color: 0x7ef0c1 }));
  barFg.position.y = 84;
  barFg.visible = false;
  grp.add(barFg);
  grp.userData.barBg = barBg;
  grp.userData.barFg = barFg;
  grp.userData.bodyMat = bodyMat;
  return grp;
}

function buildWorld() {
  if (!initGL()) return;
  // clear previous round's dynamic stuff
  for (const w of dynWallMeshes) scene.remove(w);
  dynWallMeshes = [];
  for (const [, m] of powerMeshes) scene.remove(m);
  powerMeshes.clear();
  for (const [, m] of playerMeshes) scene.remove(m);
  playerMeshes.clear();
  if (worldBuilt) return;
  worldBuilt = true;

  const skirt = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshBasicMaterial({ color: 0x18223c }));
  skirt.rotation.x = -Math.PI / 2;
  skirt.position.set(map.w / 2, -2, map.h / 2);
  scene.add(skirt);

  // distant night-city silhouettes to fill the horizon
  const silMat = new THREE.MeshBasicMaterial({ color: 0x232f52 });
  const silMat2 = new THREE.MeshBasicMaterial({ color: 0x1f2a4c });
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < 26; i++) {
    const side = i % 4;
    const bw = 160 + rnd() * 260, bh = 70 + rnd() * 190, bd = 160 + rnd() * 260;
    let sx, sz;
    if (side === 0) { sx = rnd() * map.w; sz = -550 - rnd() * 900; }
    else if (side === 1) { sx = rnd() * map.w; sz = map.h + 550 + rnd() * 900; }
    else if (side === 2) { sx = -550 - rnd() * 900; sz = rnd() * map.h; }
    else { sx = map.w + 550 + rnd() * 900; sz = rnd() * map.h; }
    const b = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), i % 2 ? silMat : silMat2);
    b.position.set(sx, bh / 2 - 2, sz);
    scene.add(b);
  }

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(map.w, map.h), new THREE.MeshLambertMaterial({ map: floorTexture() }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(map.w / 2, 0, map.h / 2);
  scene.add(floor);

  const wallMat = new THREE.MeshLambertMaterial({ color: 0x3a4a6e });
  const capMat = new THREE.MeshLambertMaterial({ color: 0x4d618c });
  for (const w of map.walls) {
    const h = 55;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w.w, h, w.h), wallMat);
    m.position.set(w.x + w.w / 2, h / 2, w.y + w.h / 2);
    scene.add(m);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(w.w + 4, 6, w.h + 4), capMat);
    cap.position.set(w.x + w.w / 2, h + 3, w.y + w.h / 2);
    scene.add(cap);
    wallMeshes.push(m, cap);
  }

  // crates
  const crateMat = new THREE.MeshLambertMaterial({ color: 0xb97f3e });
  map.spots.forEach((s, i) => {
    const id = s.id !== undefined ? s.id : i;
    const m = new THREE.Mesh(new THREE.BoxGeometry(40, 40, 40), crateMat.clone());
    m.position.set(s.x, 20, s.y);
    m.rotation.y = (i % 4) * 0.4;
    m.userData.spotId = id;
    scene.add(m);
    spotMeshes.push(m);
  });

  // vault
  const v = map.vault;
  vaultMesh = new THREE.Mesh(new THREE.BoxGeometry(70, 60, 70), new THREE.MeshLambertMaterial({ color: 0x2f8f5b, emissive: 0x1d5c39 }));
  vaultMesh.position.set(v.x + v.w / 2, 30, v.y + v.h / 2);
  scene.add(vaultMesh);
  vaultGlow = new THREE.Mesh(new THREE.TorusGeometry(90, 6, 8, 28), new THREE.MeshBasicMaterial({ color: 0x7ef0c1, transparent: true, opacity: 0.5 }));
  vaultGlow.rotation.x = Math.PI / 2;
  vaultGlow.position.set(v.x + v.w / 2, 4, v.y + v.h / 2);
  scene.add(vaultGlow);
}

let camPos = null;
function tick() {
  requestAnimationFrame(tick);
  if (!renderer || (phase !== 'game' && phase !== 'end')) return;
  const now = Date.now();

  // players
  const seen = new Set();
  for (const p of state.players) {
    seen.add(p.id);
    let m = playerMeshes.get(p.id);
    if (!m) { m = makePlayerMesh(p); playerMeshes.set(p.id, m); scene.add(m); }
    if (p.x < -100) { m.visible = false; continue; }
    m.visible = true;
    m.position.x = p.x;
    m.position.z = p.y;
    // face movement direction
    if (m._lx !== undefined) {
      const dx = p.x - m._lx, dy = p.y - m._ly;
      if (Math.abs(dx) + Math.abs(dy) > 0.5) m.rotation.y = Math.atan2(dx, dy);
    }
    m._lx = p.x; m._ly = p.y;
    m.userData.ring.visible = !!p.s;
    if (p.s) m.userData.ring.rotation.z = now / 300;
    m.userData.ice.visible = !!p.f;
    const ghosted = (p.g === 1) || (p.id === myId && state.me && state.me.ghost);
    m.userData.bodyMat.transparent = ghosted;
    m.userData.bodyMat.opacity = ghosted ? 0.35 : 1;
    m.userData.rmark.visible = (revealId === p.id && now < revealUntil);
    if (m.userData.rmark.visible) m.userData.rmark.scale.setScalar(1 + 0.1 * Math.sin(now / 150));
    // progress bars
    let frac = 0, col = 0x7ef0c1;
    if (p.sp > 0) { frac = p.sp; col = 0x7ef0c1; }
    if (p.id === myId && state.me && state.me.deposit > 0) { frac = state.me.deposit; col = 0xffd34d; }
    m.userData.barBg.visible = m.userData.barFg.visible = frac > 0;
    if (frac > 0) {
      m.userData.barFg.scale.x = Math.max(0.02, frac);
      m.userData.barFg.position.x = -25 * (1 - frac);
      m.userData.barFg.material.color.setHex(col);
    }
  }
  for (const [id, m] of playerMeshes) {
    if (!seen.has(id)) { scene.remove(m); playerMeshes.delete(id); }
  }

  // crates: searched ones sink and darken
  for (const c of spotMeshes) {
    const searched = state.spots.includes(c.userData.spotId);
    const targetY = searched ? -14 : 20;
    c.position.y += (targetY - c.position.y) * 0.1;
    c.material.color.setHex(searched ? 0x4a3c28 : 0xb97f3e);
  }

  // dynamic walls
  const walls = state.walls || [];
  while (dynWallMeshes.length < walls.length) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(80, 55, 80), new THREE.MeshLambertMaterial({ color: 0xc98d4b, transparent: true }));
    scene.add(m);
    dynWallMeshes.push(m);
  }
  dynWallMeshes.forEach((m, i) => {
    if (i < walls.length) {
      const w = walls[i];
      m.visible = true;
      m.scale.set((w.w || 80) / 80, 1, (w.h || 80) / 80);
      m.position.set(w.x + (w.w || 80) / 2, 27, w.y + (w.h || 80) / 2);
      m.material.opacity = Math.min(1, (w.ttl || 15) / 4);
    } else m.visible = false;
  });

  // power-ups
  const pseen = new Set();
  for (const pu of (state.powers || [])) {
    pseen.add(pu.id);
    let m = powerMeshes.get(pu.id);
    if (!m) {
      m = new THREE.Mesh(new THREE.OctahedronGeometry(16), new THREE.MeshLambertMaterial({ color: POW_COLORS[pu.type] || 0xffffff, emissive: POW_COLORS[pu.type] || 0x888888, emissiveIntensity: 0.4 }));
      powerMeshes.set(pu.id, m);
      scene.add(m);
    }
    m.position.set(pu.x, 30 + 8 * Math.sin(now / 300 + pu.id), pu.y);
    m.rotation.y = now / 500;
  }
  for (const [id, m] of powerMeshes) {
    if (!pseen.has(id)) { scene.remove(m); powerMeshes.delete(id); }
  }

  // vault pulse
  if (vaultGlow) {
    vaultGlow.material.opacity = 0.35 + 0.25 * Math.sin(now / 400);
    vaultGlow.scale.setScalar(1 + 0.06 * Math.sin(now / 400));
  }

  // camera: third-person follow
  const mine = state.players.find(p => p.id === myId);
  if (mine && mine.x > -100) {
    const tx = mine.x, tz = mine.y;
    if (!camPos) camPos = { x: tx, z: tz };
    camPos.x += (tx - camPos.x) * 0.12;
    camPos.z += (tz - camPos.z) * 0.12;
    camera.position.set(camPos.x, 210, camPos.z + 330);
    camera.lookAt(camPos.x, 30, camPos.z - 170);
  }
  renderer.render(scene, camera);
}

function onResize() {
  if (!renderer) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

function me() { return state.players.find(p => p.id === myId); }

function updateHud() {
  const left = state.left || 0;
  const mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, '0');
  $('timer').textContent = mm + ':' + ss;
  $('timer').classList.toggle('warn', left <= 30);
  $('scoreline').textContent = 'متبقّي ' + (map ? map.spots.length - state.spots.length : 0) + ' أماكن';

  const meInfo = state.me || {};
  const chips = [];
  if (meInfo.speed) chips.push('⚡ سرعة');
  if (meInfo.shield) chips.push('🛡️ درع');
  if (meInfo.ghost) chips.push('👻 مختفي');
  if (meInfo.goggles) chips.push('🥽 نظارة');
  if (Date.now() < revealUntil) chips.push('👁️ كاشف الحرامي');
  $('effects').innerHTML = chips.map(c => '<span class="fx">' + c + '</span>').join('');

  if (phase !== 'game') return;
  const m = me();
  if (!m) return;
  const meFrozen = !!m.f;
  let nearSpot = false;
  if (map) {
    for (const s of map.spots) {
      const sid = s.id !== undefined ? s.id : map.spots.indexOf(s);
      if (state.spots.includes(sid)) continue;
      if (Math.hypot(m.x - s.x, m.y - s.y) < 80) { nearSpot = true; break; }
    }
  }
  $('btnSearch').classList.toggle('hidden', !(nearSpot && !meFrozen));
  let nearPlayer = false;
  for (const p of state.players) {
    if (p.id === myId || p.x < -100) continue;
    if (Math.hypot(m.x - p.x, m.y - p.y) < 115) { nearPlayer = true; break; }
  }
  $('btnExpose').classList.toggle('hidden', !(nearPlayer && !meFrozen));
  $('wallCount').textContent = (meInfo.walls || 0).toLocaleString('ar-EG');
  $('btnBuild').classList.toggle('hidden', !((meInfo.walls || 0) > 0 && !meFrozen));
  $('btnGhost').classList.toggle('hidden', !(carrier && meInfo.ghostLeft && !meFrozen));
}

let toastTimer = null;
function toast(txt) {
  $('toastTxt').textContent = txt;
  $('toast').classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 3200);
}
function buzz(pat) { try { navigator.vibrate && navigator.vibrate(pat); } catch (e) { } }

// ---------- input: joystick ----------
const stick = $('stick'), knob = $('knob');
let stickId = null, sdx = 0, sdy = 0, lastSent = '';
function setKnob(dx, dy) {
  knob.style.left = (38 + dx * 34) + 'px';
  knob.style.top = (38 + dy * 34) + 'px';
}
function sendInput() {
  const key = sdx.toFixed(2) + ',' + sdy.toFixed(2);
  if (key === lastSent) return;
  lastSent = key;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'input', dx: sdx, dy: sdy }));
}
stick.addEventListener('touchstart', e => {
  e.preventDefault();
  stickId = e.changedTouches[0].identifier;
}, { passive: false });
addEventListener('touchmove', e => {
  if (stickId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== stickId) continue;
    const r = stick.getBoundingClientRect();
    let dx = (t.clientX - (r.left + r.width / 2)) / (r.width / 2);
    let dy = (t.clientY - (r.top + r.height / 2)) / (r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }
    sdx = dx; sdy = dy;
    setKnob(dx, dy);
    sendInput();
  }
}, { passive: false });
addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== stickId) continue;
    stickId = null; sdx = 0; sdy = 0;
    setKnob(0, 0);
    sendInput();
  }
});

// keyboard fallback (desktop testing)
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'e') $('btnSearch').click();
  if (e.key.toLowerCase() === 'q') $('btnExpose').click();
  if (e.key.toLowerCase() === 'b') $('btnBuild').click();
  if (e.key.toLowerCase() === 'g') $('btnGhost').click();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
setInterval(() => {
  if (stickId !== null) return;
  const dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  const dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  sdx = dx; sdy = dy; sendInput();
}, 60);

$('btnSearch').addEventListener('click', () => ws && ws.readyState === 1 && ws.send(JSON.stringify({ t: 'search' })));
$('btnExpose').addEventListener('click', () => ws && ws.readyState === 1 && ws.send(JSON.stringify({ t: 'expose' })));
$('btnBuild').addEventListener('click', () => ws && ws.readyState === 1 && ws.send(JSON.stringify({ t: 'build' })));
$('btnGhost').addEventListener('click', () => ws && ws.readyState === 1 && ws.send(JSON.stringify({ t: 'ghost' })));

// ---------- lobby wiring ----------
$('btnJoin').addEventListener('click', () => {
  const name = $('nameIn').value.trim();
  if (!name) { $('joinErr').textContent = 'اكتب اسمك الأول'; return; }
  $('joinErr').textContent = '';
  connect(name, $('codeIn').value.trim(), ok => { });
});
$('btnStart').addEventListener('click', () => ws && ws.readyState === 1 && ws.send(JSON.stringify({ t: 'start' })));
$('btnAddBot').addEventListener('click', () => ws && ws.send(JSON.stringify({ t: 'addbot' })));
$('btnRmBot').addEventListener('click', () => ws && ws.send(JSON.stringify({ t: 'rmbot' })));
$('btnAgain').addEventListener('click', () => $('endOverlay').classList.add('hidden'));
$('btnShare').addEventListener('click', async () => {
  const link = location.origin + '/?room=' + roomCode;
  const text = 'تعالوا نلعب "Lowkey" 🫣 كود الأوضة: ' + roomCode + '\n' + link;
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { }
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('اللينك اتنسخ! ابعته لصحابك 📋');
  } catch (e) {
    toast('الكود: ' + roomCode);
  }
});

if (qs.get('room')) $('codeIn').value = qs.get('room').toUpperCase().slice(0, 4);
if (!window.THREE) fallback2d();
